pipeline:
  experiment_id: exp05_example_vocabulary_large_warmstart_seed48
  trait: vocabulary
  train_folds:
  - C
  - D
  - E
  - A
  test_fold: B
  val_ratio: 0.1
  seed: 48
determinism:
  enabled: true
  warn_only: false
  allow_tf32: false
hardware:
  cuda_device: 0
metadata:
  experiment_id: exp05_example_vocabulary_large_warmstart_seed48
  notes: vocabulary large-cache warm-start (Stage1=1 epoch, adapter reused)
paths:
  essays_csv: data/datasets/main/train_with_folds.csv
  output_dir: outputs/exp05_example_vocabulary_large_warmstart/vocabulary
  checkpoint_dir: checkpoints/exp05_example_vocabulary_large_warmstart/vocabulary
  pair_cache_dir: data/pairs_large
  embedding_dir: data/embeddings
model:
  base_model: /path/to/local/meta-llama-checkpoint
  quantization: none
stage1_relative:
  enabled: true
  pairs_file: data/pairs_large/run2_vocabulary.jsonl
  pairs_meta: data/pairs_large/run2_vocabulary_meta.json
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  training:
    epochs: 1
    batch_size: 4
    lr: 0.0002
    weight_decay: 0.01
    log_every: 100
    monitor: val_acc
    monitor_mode: max
    early_stop_patience: 1
    early_stop_min_delta: 0.0005
  outputs:
    save_adapter: true
    save_embeddings: true
stage2_absolute:
  mode: base
  lora:
    reuse_relative_adapter: true
    new_adapter_rank: 16
    alpha: 32
    dropout: 0.05
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  training:
    epochs: 15
    batch_size: 4
    lr: 0.0001
    weight_decay: 0.01
    log_every: 100
    monitor: val_qwk
    monitor_mode: max
    early_stop_patience: 4
    early_stop_min_delta: 0.0005
  embedding_fusion:
    enabled: false
